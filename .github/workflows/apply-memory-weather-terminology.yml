name: apply-memory-weather-terminology

on:
  push:
    branches:
      - feature/memory-weather-lab
    paths:
      - "scripts/apply-memory-weather-terminology.mjs"
      - ".github/workflows/apply-memory-weather-terminology.yml"

permissions:
  contents: write

concurrency:
  group: apply-memory-weather-terminology
  cancel-in-progress: false

jobs:
  patch-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/memory-weather-lab
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: |
            apps/simulator/package-lock.json
            apps/memory-weather-lab/package-lock.json

      - name: Apply presentation-only terminology patch
        run: node scripts/apply-memory-weather-terminology.mjs

      - name: Verify standalone Memory Weather
        working-directory: apps/memory-weather
        run: npm run verify

      - name: Verify Memory Weather Lab
        working-directory: apps/memory-weather-lab
        run: |
          npm ci
          npm run verify

      - name: Verify simulator and Pages package
        run: |
          npm ci --prefix apps/simulator
          npm run check --prefix apps/simulator
          node scripts/assemble-pages-site.mjs
          node scripts/verify-pages-site.mjs

      - name: Confirm engine and canonical surfaces are untouched
        run: |
          git diff --exit-code HEAD -- \
            src/engine.ts \
            apps/memory-weather/src/engine.js \
            apps/memory-weather-lab/src/vendor/engine.js \
            SKILL.md \
            skills/qoft-qosmos/SKILL.md

      - name: Remove one-shot patch machinery
        run: |
          rm -f scripts/apply-memory-weather-terminology.mjs
          rm -f .github/workflows/apply-memory-weather-terminology.yml

      - name: Commit verified terminology clarification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && {
            echo "No changes were produced."
            exit 1
          }
          git commit -m "Clarify Memory Weather terminology"
          git push origin HEAD:feature/memory-weather-lab
