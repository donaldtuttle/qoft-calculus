name: memory-weather

on:
  push:
    branches: [main]
    paths:
      - "apps/memory-weather/**"
      - ".github/workflows/memory-weather.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/memory-weather/**"
      - ".github/workflows/memory-weather.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/memory-weather
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.12.0"
      - run: npm run verify
