name: deploy-memory-weather-pages

on:
  push:
    branches: [main]
    paths:
      - "apps/memory-weather/**"
      - ".github/workflows/deploy-memory-weather-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: memory-weather-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.12.0"
      - name: Verify Memory Weather
        working-directory: apps/memory-weather
        run: npm run verify
      - name: Confirm generated artifacts are committed
        run: git diff --exit-code -- apps/memory-weather
      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp apps/memory-weather/dist/memory-weather.html _site/index.html
          cp apps/memory-weather/dist/memory-weather.html _site/memory-weather.html
          node -e 'const fs=require("fs"); for (const p of ["_site/index.html","_site/memory-weather.html"]) { const html=fs.readFileSync(p,"utf8").replaceAll("../docs/REALIZATION_CONTRACT.md","https://github.com/donaldtuttle/qoft-calculus/blob/main/apps/memory-weather/docs/REALIZATION_CONTRACT.md"); fs.writeFileSync(p,html); }'
          touch _site/.nojekyll
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
