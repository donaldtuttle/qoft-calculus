name: deploy-qosmos-pages

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "src/engine.ts"
      - "SKILL.md"
      - "scripts/assemble-pages-site.mjs"
      - "scripts/verify-pages-site.mjs"
      - ".github/workflows/deploy-memory-weather-pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/**"
      - "src/engine.ts"
      - "SKILL.md"
      - "scripts/assemble-pages-site.mjs"
      - "scripts/verify-pages-site.mjs"
      - ".github/workflows/deploy-memory-weather-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: |
            apps/simulator/package-lock.json
            apps/memory-weather-lab/package-lock.json
      - name: Verify Memory Weather
        working-directory: apps/memory-weather
        run: npm run verify
      - name: Confirm generated artifacts are committed
        run: git diff --exit-code -- apps/memory-weather
      - name: Install simulator dependencies
        working-directory: apps/simulator
        run: npm ci
      - name: Verify and build simulator
        working-directory: apps/simulator
        run: npm run check
      - name: Install Memory Weather Lab dependencies
        working-directory: apps/memory-weather-lab
        run: npm ci
      - name: Verify and build Memory Weather Lab
        working-directory: apps/memory-weather-lab
        run: npm run verify
      - name: Assemble Pages artifact
        run: node scripts/assemble-pages-site.mjs
      - name: Verify Pages routes and assets
        run: node scripts/verify-pages-site.mjs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
