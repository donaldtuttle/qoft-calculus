name: apply-reflex-cold-start-fix

on:
  push:
    branches: ["fix/reflex-cold-start"]
    paths:
      - ".github/workflows/apply-reflex-cold-start-fix.yml"

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/reflex-cold-start
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.12.0"

      - name: Apply repair and recompute pins
        run: python scripts/apply_reflex_cold_start_fix.py

      - name: Test root engine
        run: |
          npm ci
          npm test
          npm run typecheck

      - name: Verify and build simulator
        working-directory: apps/simulator
        run: |
          npm ci
          npm run check

      - name: Commit verified repair
        run: |
          git rm .github/workflows/apply-reflex-cold-start-fix.yml
          git rm scripts/apply_reflex_cold_start_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine.ts tests/determinism.ts CHANGELOG.md apps/simulator
          git commit -m "fix(simulator): remove zero-prior startup snap"
          git push origin HEAD:fix/reflex-cold-start
